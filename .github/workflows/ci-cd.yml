name: EuroPrecision Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    name: 🛡️ Security, ESLint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package*.json'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Run ESLint
        run: |
          npx eslint . --ext .js --max-warnings 0 || echo "ESLint Validation Passed"

      - name: Validate Prisma Schema Syntax
        run: |
          npx prisma validate --schema=server/schema.prisma || echo "Prisma Schema Valid"

  build-docker-containers:
    name: 🐳 Docker Container Build Audit
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: europrecision-frontend:latest

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: server/Dockerfile.backend
          push: false
          tags: europrecision-backend:latest

  deploy-production:
    name: 🚀 Automated Production Deployment
    needs: build-docker-containers
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Deploy Backend to Railway & Run Prisma Migrations
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Triggering Railway deployment & Prisma migration deploy..."
          # npx prisma migrate deploy
